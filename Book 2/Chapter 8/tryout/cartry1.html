<!DOCTYPE html>
<!-- Tells the browser: this is an HTML5 document -->

<html>
<!-- Everything on the page lives inside <html> -->

<head>
    <!-- The head holds information ABOUT the page -->

    <title>Cars</title>
    <!-- This is the text you see on the browser tab -->

    <link rel="stylesheet" href="cartry1.css">
    <!-- This connects the CSS file to style the page -->
</head>

<body>
    <!-- The body holds everything you SEE on the page -->

    <div id="car">
        <!-- This is the main car container -->

        This <span id="modelyear"></span> dream car can be yours for
        just: $<span id="pricetag"></span>
        <!-- The spans above will be filled using JavaScript -->

        <div id="body"></div>
        <!-- This is the body of the car -->

        <div id="frontwheel"></div>
        <!-- This is the front wheel -->

        <div id="backwheel"></div>
        <!-- This is the back wheel -->
    </div>

    <!-- This connects the JavaScript file -->
    <script src="cartry1.js"></script>
</body>

</html>
