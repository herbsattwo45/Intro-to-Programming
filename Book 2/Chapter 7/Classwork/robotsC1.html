
<!DOCTYPE html>
<html>
<head>
    <title>Happy Robot</title>

    <!-- Link to the CSS file (this controls how things look) -->
    <link rel="stylesheet" href="robotsC3.css">
</head>
<body>

<!-- This is the whole robot -->
<div id="robot">

    <!-- Robot head -->
    <div id="head">

        <!-- Left eye -->
        <div class="eye" id="lefteye"></div>

        <!-- Right eye -->
        <div class="eye" id="righteye"></div>

        <!-- Happy mouth -->
        <div id="mouth"></div>
    </div>

    <!-- Left arm -->
    <div class="arm" id="leftarm"></div>

    <!-- Robot body -->
    <div id="body">
        <p>I &lt;3 JS!</p>
    </div>

    <!-- Right arm -->
    <div class="arm" id="rightarm"></div>
</div>

<!-- Link to JavaScript file (this controls movement) -->
<script src="robotsC2.js"></script>

</body>
</html>
