<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 12 – Making It Functional</title>
    <link rel="stylesheet" href="chap12.css">
</head>

<body>
    <h1>Making It Functional</h1>

    <!-- Instructions displayed on the page -->
    <div id="instructions">
        <p><strong>Instructions:</strong></p>
        <ul>
            <li>Click the car to make it go faster.</li>
            <li>Each click increases the speed.</li>
            <li>Click <strong>Stop!</strong> to stop the car.</li>
            <li>If the car reaches the end of the track, it will crash.</li>
        </ul>
    </div>

    <div id="container">
        <div id="track">
            <!-- Car replaces train, using an online image -->
            <div id="car">
                <img src="" alt="Car">
            </div>
        </div>

        <div id="stopButton">Stop!</div>
    </div>

    <script src="chap12.js"></script>
</body>
</html>
